name: Release

on:
  push:
    tags:
      - "v*" # Trigger on version tags

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC
      contents: write # Required for creating releases
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Check versions match tag
        run: |
          # Extract version from pyproject.toml
          PACKAGE_VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          # Extract version from manifest.json
          MANIFEST_VERSION=$(jq -r .version custom_components/mammotion/manifest.json)
          # Get version from tag
          TAG_VERSION=${{ steps.get_version.outputs.version }}

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Package version ($PACKAGE_VERSION) in pyproject.toml does not match tag version ($TAG_VERSION)"
            exit 1
          fi
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "Manifest version ($MANIFEST_VERSION) in manifest.json does not match tag version ($TAG_VERSION)"
            exit 1
          fi

      - name: Get previous version
        id: get_previous_version
        run: |
          # The stable release this one follows; betas in between are part of this release.
          previous_tag=$(git describe --tags --abbrev=0 --exclude '*beta*' "${{ github.ref_name }}^" 2>/dev/null || true)
          if [ -z "$previous_tag" ]; then
            previous_tag=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "previous_version=${previous_tag}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          {
            echo 'changelog<<EOF'
            scripts/release_notes "${{ steps.get_previous_version.outputs.previous_version }}..${{ github.ref_name }}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create_release
        uses: comnoco/create-release-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ${{ steps.changelog.outputs.changelog }}

            [Full changelog](https://github.com/${{ github.repository }}/compare/${{ steps.get_previous_version.outputs.previous_version }}...${{ github.ref_name }}) · [Report an issue](https://github.com/${{ github.repository }}/issues) · [Discord](https://discord.gg/vpZdWhJX8x)
          draft: false
          prerelease: false
